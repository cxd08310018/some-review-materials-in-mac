<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vue</title>
    
</head>
<body>

    <div id="root">
        <h2>当前的n值是{{n}}</h2>
        <button click="add">n+1</button>
    </div>

    <script src="vue.js"></script>
    <script src="days.js"></script>
    <script>
        new Vue({
            el:'#root',
            data:{
                n:1
            },
            methods: {
                add(){
                    this.n++
                }                
            },
        })
    </script>

</body>
</html>
